services:
  backend:
    image: "${COMPOSE_PROJECT_NAME:-visual-pbx}-backend:0.1.0-node24.19.0"
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      DATA_DIR: /data
      CONFIG_OUT_DIR: /shared-config
      # Ubuntu 22.04's asterisk user/group is 101. Generated files stay
      # owner-writable and are group-readable by the Asterisk process only.
      CONFIG_READER_GID: "101"
      SOUNDS_READER_GID: "101"
      ASTERISK_PREFLIGHT_DIR: /shared-config/preflight
      PBX_REQUIRE_ASTERISK_PREFLIGHT: "true"
      SOUNDS_DIR: /sounds
      AMI_HOST: asterisk
      AMI_PORT: "5038"
      AMI_USERNAME: ${AMI_USERNAME:-visualpbx}
      AMI_SECRET: ${AMI_SECRET:?Set AMI_SECRET to a synthetic local test value}
      PBX_MASTER_KEY: ${PBX_MASTER_KEY:?Set PBX_MASTER_KEY to a synthetic 32-byte Base64 value}
      PBX_ENV: ${PBX_ENV:-development}
      PBX_SECURE_COOKIES: ${PBX_SECURE_COOKIES:-false}
      # Safe, non-secret endpoint metadata shown on the local softphone guide.
      # This does not expose or enable a trunk and follows the loopback mapping.
      PBX_CLIENT_SIP_HOST: ${PBX_CLIENT_SIP_HOST:-127.0.0.1}
      PBX_CLIENT_SIP_PORT: ${PBX_SIP_PORT:-5060}
    volumes:
      - pbx-data:/data
      - asterisk-generated:/shared-config
      # Shared with Asterisk, which reaches it via the
      # /usr/share/asterisk/sounds/custom symlink, so uploads are playable as
      # "custom/<name>" without restarting anything.
      - asterisk-sounds:/sounds
    ports:
      # Bound to loopback: the frontend reaches the API through nginx on the
      # compose network, so there is no reason to expose it to the LAN.
      - "${PBX_BIND_ADDRESS:-127.0.0.1}:${PBX_BACKEND_PORT:-4000}:4000"
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    depends_on:
      - asterisk

  frontend:
    image: "${COMPOSE_PROJECT_NAME:-visual-pbx}-frontend:0.1.0-node24.19.0"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${PBX_BIND_ADDRESS:-127.0.0.1}:${PBX_FRONTEND_PORT:-8080}:80"
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    depends_on:
      - backend

  asterisk:
    image: "${COMPOSE_PROJECT_NAME:-visual-pbx}-asterisk:22.10.1"
    build:
      context: ./asterisk
    restart: unless-stopped
    environment:
      AMI_USERNAME: ${AMI_USERNAME:-visualpbx}
      AMI_SECRET: ${AMI_SECRET:?Set AMI_SECRET to a synthetic local test value}
    volumes:
      - asterisk-generated:/etc/asterisk/generated
      - asterisk-sounds:/usr/local/share/asterisk/sounds
    ports:
      # The default test/development stack is loopback-only. A production
      # network design is an explicit deployment concern, not a Compose default.
      - "${PBX_BIND_ADDRESS:-127.0.0.1}:${PBX_SIP_PORT:-5060}:5060/udp"
      - "${PBX_BIND_ADDRESS:-127.0.0.1}:${PBX_RTP_PORT_RANGE:-10000-10100}:10000-10100/udp"
      # AMI is a full remote-control interface. The backend talks to it over the
      # compose network, so it is published on loopback only, for debugging.
      - "${PBX_BIND_ADDRESS:-127.0.0.1}:${PBX_AMI_PORT:-5038}:5038"

volumes:
  pbx-data:
  asterisk-generated:
  asterisk-sounds:
