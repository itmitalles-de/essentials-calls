name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  AMI_USERNAME: visualpbx
  AMI_SECRET: synthetic-ci-ami-secret-2026
  PBX_MASTER_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
  ACCEPTANCE_ADMIN_PASSWORD: SyntheticCiAdmin-2026!
  PBX_ENV: test

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Dependency advisories
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production bundles
        run: npm run build

      - name: Tracked-file secret scan
        run: npm run scan:secrets

      - name: Patch whitespace check
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$CHECK_BASE_SHA...$CHECK_HEAD_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

      - name: Generate npm CycloneDX SBOM
        run: |
          npm run --silent sbom > essentials-calls-npm.cdx.json
          node -e "const fs=require('node:fs'); const bom=JSON.parse(fs.readFileSync('essentials-calls-npm.cdx.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components) || bom.components.length === 0) process.exit(1);"

      - name: Upload pilot-build SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essentials-calls-npm-sbom-${{ github.sha }}
          path: essentials-calls-npm.cdx.json
          retention-days: 3
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.acceptance.yml --profile acceptance config --quiet

      - name: Build all compose images
        run: docker compose -f docker-compose.yml -f docker-compose.acceptance.yml --profile acceptance build

  synthetic-telephony:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Full-stack Asterisk and SIPp acceptance
        run: npm run test:full-stack

      - name: Upload redacted full-stack failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-stack-failure-${{ github.run_id }}
          path: artifacts/acceptance-failure-*
          retention-days: 3
          if-no-files-found: ignore

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Semantic browser acceptance
        run: npm run test:e2e

      - name: Upload redacted browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}
          path: artifacts/browser-failure-*
          retention-days: 3
          if-no-files-found: ignore

  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Empty restore and post-restore SIP callflow
        run: npm run test:backup-restore

      - name: Upload redacted recovery failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-restore-failure-${{ github.run_id }}
          path: artifacts/backup-restore-failure-*
          retention-days: 3
          if-no-files-found: ignore
