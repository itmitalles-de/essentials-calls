[modules]
autoload = yes

; Ubuntu ships three mutually exclusive voicemail backends. Whichever loads
; first wins, and app_voicemail_odbc was winning — it needs an ODBC database
; and fails with "Failed to obtain database object" on every message, so
; voicemail appeared configured but could never store anything. Blocking the
; ODBC/IMAP variants lets the plain file-based app_voicemail.so load.
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so

; chan_sip is deprecated and unused here (all endpoints are PJSIP).
noload => chan_sip.so

; The distribution package contains hardware, legacy signalling, ARI, HEP and
; external database adapters that this isolated PJSIP stack neither configures
; nor uses. Leaving them on autoload produces alarming startup errors (missing
; ALSA cards, Radius/ODBC files, ARI users, and legacy channel configs) even
; though the PBX itself is healthy. Keep the required PJSIP/CSV-CDR modules on
; autoload and explicitly suppress only those unrelated adapters.
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => pbx_dundi.so

noload => res_ari.so
noload => res_ari_applications.so
noload => res_ari_asterisk.so
noload => res_ari_bridges.so
noload => res_ari_channels.so
noload => res_ari_device_states.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_ari_model.so
noload => res_ari_playbacks.so
