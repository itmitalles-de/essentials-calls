[modules]
autoload = yes

; Ubuntu ships three mutually exclusive voicemail backends. Whichever loads
; first wins, and app_voicemail_odbc was winning — it needs an ODBC database
; and fails with "Failed to obtain database object" on every message, so
; voicemail appeared configured but could never store anything. Blocking the
; ODBC/IMAP variants lets the plain file-based app_voicemail.so load.
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so

; chan_sip is deprecated and unused here (all endpoints are PJSIP).
noload => chan_sip.so
