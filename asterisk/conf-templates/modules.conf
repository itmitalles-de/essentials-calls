[modules]
autoload = yes

; Only the plain file-based voicemail module belongs in this isolated runtime.
; Keep the alternative storage backends disabled even if a future source build
; discovers their optional development libraries.
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so

; Hardware, legacy signalling, ARI, HEP and external database adapters are not
; part of this isolated PJSIP proof of concept. Keep required PJSIP, AMI,
; voicemail and CSV/CDR modules on autoload and suppress unrelated adapters.
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_iax2.so
noload => pbx_ael.so
noload => pbx_dundi.so

noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_config_ldap.so
noload => res_config_odbc.so
noload => res_config_pgsql.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_smdi.so
noload => res_adsi.so

noload => app_adsiprog.so
noload => app_getcpeid.so

noload => cel_custom.so
noload => cel_odbc.so
noload => cel_pgsql.so
noload => cel_radius.so
noload => cel_sqlite3_custom.so
noload => cel_tds.so
noload => cdr_adaptive_odbc.so
noload => cdr_custom.so
